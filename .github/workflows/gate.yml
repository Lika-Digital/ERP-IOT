# Same script as the local hooks (spec §9 TC-ERP-GATE-01). CI does not have its
# own idea of what "green" means.
name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp-ci-only
          POSTGRES_DB: erp_boot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # the VPS runs Ubuntu 24.04's Python 3.12; the lock is proven on that (v25, P-1)
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Backend venv from the lock
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --no-deps -r backend/requirements.lock
      - name: Chromium for the browser check (BOOT-01b)
        run: backend/.venv/bin/python -m playwright install --with-deps chromium
      - name: Frontend from the lock
        run: npm ci
        working-directory: frontend
      - name: A second database for the growth check
        run: PGPASSWORD=erp-ci-only psql -h localhost -U erp -d erp_boot -c "CREATE DATABASE erp_growth"
      - name: Gate
        env:
          # boot check migrates and boots against real Postgres here, SQLite locally
          BOOT_DATABASE_URL: postgresql://erp:erp-ci-only@localhost:5432/erp_boot
          # growth check measures bytes per table on real Postgres (pg_total_relation_size)
          GROWTH_DATABASE_URL: postgresql://erp:erp-ci-only@localhost:5432/erp_growth
        run: bash scripts/gate.sh
      # 5b step 11: the VPS gets THIS bundle — the one the gate built and the browser
      # check passed — never a build of its own (spec §8.2). Byte-for-byte repeatable
      # tarball, and its sha256 to check on the VPS before it is unpacked.
      - name: frontend/dist for the VPS
        run: |
          tar --sort=name --mtime='2026-01-01 00:00Z' --owner=0 --group=0 --numeric-owner               -C frontend -cf - dist | gzip -n > erp-iot-dist.tar.gz
          sha256sum erp-iot-dist.tar.gz | tee erp-iot-dist.tar.gz.sha256
          # what it was built from; the VPS takes the bundle whose frontend tree equals
          # the frontend of the code it runs (git rev-parse HEAD:frontend)
          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "frontend_tree=$(git rev-parse HEAD:frontend)"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } | tee SOURCE
      - uses: actions/upload-artifact@v4
        with:
          name: erp-iot-dist-${{ github.sha }}
          path: |
            erp-iot-dist.tar.gz
            erp-iot-dist.tar.gz.sha256
            SOURCE
          retention-days: 90
          if-no-files-found: error

  # 5b step 11 (decision 2026-10-17): the repo is private and the VPS reads it only with
  # a read-only deploy key — no token. So the bundle the gate built goes to the branch
  # `dist`, into <frontend tree>/, and the VPS fetches it over git. Only this job may
  # write, and it runs no npm and no project code. A tree once published never changes.
  publish-dist:
    needs: gate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/faza/5b-vps')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-dist
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: erp-iot-dist-${{ github.sha }}
          path: ${{ runner.temp }}/bundle
      - name: Commit the bundle to the dist branch
        env:
          BUNDLE: ${{ runner.temp }}/bundle
          WT: ${{ runner.temp }}/dist-wt
        run: |
          set -euo pipefail
          (cd "$BUNDLE" && sha256sum -c erp-iot-dist.tar.gz.sha256)
          tree=$(git rev-parse HEAD:frontend)
          grep -qx "frontend_tree=$tree" "$BUNDLE/SOURCE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin dist; then
            git worktree add -q "$WT" FETCH_HEAD
            git -C "$WT" checkout -q -B dist
          else
            git worktree add -q --orphan -b dist "$WT"
          fi
          if [ -e "$WT/$tree" ]; then
            echo "dist for frontend tree $tree already published — unchanged"; exit 0
          fi
          mkdir "$WT/$tree"
          cp "$BUNDLE/erp-iot-dist.tar.gz" "$BUNDLE/erp-iot-dist.tar.gz.sha256" "$BUNDLE/SOURCE" "$WT/$tree/"
          git -C "$WT" add "$tree"
          git -C "$WT" commit -q -m "dist: frontend $tree from ${GITHUB_SHA::7} ($GITHUB_REF_NAME)"
          # a push with GITHUB_TOKEN starts no workflow, so `dist` is never gated itself
          git -C "$WT" push -q origin dist
          echo "published $tree"
