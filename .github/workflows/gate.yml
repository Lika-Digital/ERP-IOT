# Same script as the local hooks (spec §9 TC-ERP-GATE-01). CI does not have its
# own idea of what "green" means.
name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp-ci-only
          POSTGRES_DB: erp_boot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # the VPS runs Ubuntu 24.04's Python 3.12; the lock is proven on that (v25, P-1)
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Backend venv from the lock
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --no-deps -r backend/requirements.lock
      - name: Chromium for the browser check (BOOT-01b)
        run: backend/.venv/bin/python -m playwright install --with-deps chromium
      - name: Frontend from the lock
        run: npm ci
        working-directory: frontend
      - name: A second database for the growth check
        run: PGPASSWORD=erp-ci-only psql -h localhost -U erp -d erp_boot -c "CREATE DATABASE erp_growth"
      - name: Gate
        env:
          # boot check migrates and boots against real Postgres here, SQLite locally
          BOOT_DATABASE_URL: postgresql://erp:erp-ci-only@localhost:5432/erp_boot
          # growth check measures bytes per table on real Postgres (pg_total_relation_size)
          GROWTH_DATABASE_URL: postgresql://erp:erp-ci-only@localhost:5432/erp_growth
        run: bash scripts/gate.sh
      # 5b step 11: the VPS gets THIS bundle — the one the gate built and the browser
      # check passed — never a build of its own (spec §8.2). Byte-for-byte repeatable
      # tarball, and its sha256 to check on the VPS before it is unpacked.
      - name: frontend/dist for the VPS
        run: |
          tar --sort=name --mtime='2026-01-01 00:00Z' --owner=0 --group=0 --numeric-owner               -C frontend -cf - dist | gzip -n > erp-iot-dist.tar.gz
          sha256sum erp-iot-dist.tar.gz | tee erp-iot-dist.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: erp-iot-dist-${{ github.sha }}
          path: |
            erp-iot-dist.tar.gz
            erp-iot-dist.tar.gz.sha256
          retention-days: 90
          if-no-files-found: error
