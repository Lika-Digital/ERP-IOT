# ERP-IOT · drop-in za nginx.service (deploy/11_blok_b.sh → /etc/systemd/system/nginx.service.d/)
# nginx sluša na Tailscale adresi (@TS_IP@), a ona postoji tek kad tailscaled digne
# tailscale0. Bez ovoga nginx pri pokretanju stroja može pasti s „cannot assign address".
[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
ExecStartPre=/bin/sh -c 'until ip -4 -o addr show dev tailscale0 2>/dev/null | grep -q "inet @TS_IP@/"; do sleep 1; done'
TimeoutStartSec=120
Restart=on-failure
RestartSec=5
