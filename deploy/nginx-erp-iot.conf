# ERP-IOT · nginx (5b korak 12; spec §7.0, §8.1, O43). Ugrađuje ga deploy/11_blok_b.sh,
# koji @TS_IP@ zamijeni Tailscale adresom VPS-a. Sluša SAMO na toj adresi — javno ništa.
# U 5c ovaj blok prelazi na 127.0.0.1 iza cloudflared (§7.0).
#
# Uključuje se u http{} (sites-enabled), pa zona i map stoje ovdje.

# O43: pokušaji prijave po IP-u, uz zaključavanje računa u bazi (5 → 15 min)
limit_req_zone $binary_remote_addr zone=erp_prijava:10m rate=10r/m;

map $http_upgrade $erp_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen @TS_IP@:80;
    server_name _;
    server_tokens off;

    root /var/www/erp-iot/current;
    index index.html;
    # upload referentne slike: aplikacija čita do 25 MB (reference_photo.MAX_INPUT_BYTES)
    client_max_body_size 26m;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # webhook ormara nikad kroz UI blok (§7.0: zaseban :8081, nije dio 5b)
    location ^~ /api/webhooks/ {
        return 404;
    }

    location ~ ^/api/auth/(login|mfa/verify|setup|setup/check)$ {
        limit_req zone=erp_prijava burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # adresa klijenta postavlja se, ne nadovezuje: klijent je ne može podmetnuti
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $erp_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # imena datoteka u assets/ nose hash sadržaja
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # aplikacija s rutama u pregledniku (BrowserRouter): nepoznata putanja → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
