[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Prazno namjerno: URL (i lozinka) dolazi iz DATABASE_URL preko app.config,
# isto kao za aplikaciju. Lozinka ovdje je bila javna (spec §11 O16).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
